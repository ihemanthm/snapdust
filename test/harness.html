<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SnapDust harness</title>
    <style>
      body { font: 14px system-ui, sans-serif; margin: 16px; background: #111; color: #eee; }
      video { width: 640px; max-width: 100%; background: #000; display: block; margin: 8px 0; }
      pre { background: #222; padding: 8px; }
      .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    </style>
  </head>
  <body>
    <h1>SnapDust page-hook harness</h1>
    <p>Loads <code>inject.js</code> with a fake (or real) camera and shows what "Meet" would receive.</p>
    <div class="controls">
      <label><input type="checkbox" id="real" /> use real camera</label>
      <button id="start">Start camera</button>
      <button id="vanish">Toggle vanish</button>
      <button id="capture">Capture empty room</button>
      <label><input type="checkbox" id="showMask" /> show mask</label>
      <label><input type="checkbox" id="mirror" /> mirror</label>
      <label><input type="checkbox" id="enabled" checked /> enabled</label>
    </div>
    <video id="out" autoplay muted playsinline></video>
    <pre id="info"></pre>

    <script>
      // Fake camera: a room with a person-like figure that sways, and steps out when `fake.away` is set.
      // `speed` scales how fast the person sways; `brightness` mimics camera auto-exposure;
      // `dark` mimics a webcam's black warm-up frames.
      // `second`: another, smaller person standing still at the left, behind the main one.
      const fake = { away: false, speed: 1, brightness: 1, dark: false, nextCrop: false, second: false };
      // Person: MediaPipe's test portrait, cut out of its own background by the module script
      // below, so the "empty room" behind the person is known exactly.
      let cutout = null;
      const src = document.createElement('canvas');
      src.width = 640;
      src.height = 360;
      const sctx = src.getContext('2d');
      function drawRoom(ctx) {
        ctx.fillStyle = '#c9c2b4';
        ctx.fillRect(0, 0, 640, 360);
        ctx.fillStyle = '#8fb8d8';
        ctx.fillRect(40, 40, 140, 120);
        ctx.fillStyle = '#6b4f3a';
        ctx.fillRect(460, 90, 150, 14);
        ctx.fillStyle = '#d62828';
        ctx.fillRect(480, 50, 30, 40);
      }
      function drawSecond(ctx, time = performance.now()) {
        if (!fake.second || !cutout) return;
        // Smaller (further back), at the left, ~28 px clear of the main person standing still.
        const h = 190;
        const w = (cutout.width / cutout.height) * h;
        const x = 72 + Math.sin(time / 700) * 8; // sways a little, like a real person
        ctx.drawImage(cutout, x - w / 2, 360 - h, w, h);
      }
      // What the camera sees with the main person gone.
      function drawExpected(ctx, time) {
        drawRoom(ctx);
        drawSecond(ctx, time);
      }
      let phase = 0;
      function drawScene() {
        phase += fake.speed / 30;
        if (fake.dark) {
          sctx.fillStyle = '#060606';
          sctx.fillRect(0, 0, 640, 360);
          return;
        }
        sctx.filter = fake.brightness === 1 ? 'none' : `brightness(${fake.brightness})`;
        drawRoom(sctx);
        sctx.filter = 'none';
        drawSecond(sctx);
        if (fake.away) return;
        const cx = 320 + Math.sin(phase) * 30 * Math.max(1, fake.speed);
        if (cutout) {
          const h = 360;
          const w = (cutout.width / cutout.height) * h;
          sctx.drawImage(cutout, cx - w / 2, 0, w, h);
          return;
        }
        sctx.fillStyle = '#2b4c7e';
        sctx.beginPath();
        sctx.ellipse(cx, 380, 150, 110, 0, Math.PI, 0);
        sctx.fill();
        sctx.fillStyle = '#c68642';
        sctx.fillRect(cx - 25, 220, 50, 50);
        sctx.beginPath();
        sctx.ellipse(cx, 180, 58, 72, 0, 0, Math.PI * 2);
        sctx.fill();
        sctx.fillStyle = '#2a1a10';
        sctx.beginPath();
        sctx.ellipse(cx, 130, 62, 34, 0, Math.PI, 0);
        sctx.fill();
        sctx.fillStyle = '#1b1b1b';
        sctx.fillRect(cx - 28, 170, 12, 8);
        sctx.fillRect(cx + 16, 170, 12, 8);
        sctx.fillStyle = '#8a3b2a';
        sctx.fillRect(cx - 18, 215, 36, 6);
      }
      // A second camera stream with different framing (4:3 centre crop), like Meet opening the
      // camera again at another resolution.
      const src2 = document.createElement('canvas');
      src2.width = 640;
      src2.height = 480;
      const s2ctx = src2.getContext('2d');
      setInterval(() => {
        drawScene();
        s2ctx.drawImage(src, 80, 0, 480, 360, 0, 0, 640, 480);
      }, 33);

      // Fake microphone: silence plus a little hiss, and synthetic sounds on demand.
      let audioCtx = null;
      let mic = null;
      function ensureMic() {
        if (mic) return mic;
        audioCtx = new AudioContext({ sampleRate: 48000 });
        mic = audioCtx.createMediaStreamDestination();
        const hiss = audioCtx.createBuffer(1, 48000, 48000);
        const h = hiss.getChannelData(0);
        for (let i = 0; i < h.length; i++) h[i] = (Math.random() * 2 - 1) * 0.002;
        const loop = audioCtx.createBufferSource();
        loop.buffer = hiss;
        loop.loop = true;
        loop.connect(mic);
        loop.start();
        return mic;
      }
      // Band-passed noise burst: a snap is bright and ~7 ms; a clap duller and ~25 ms.
      function playBurst(low, high, decayMs, amp) {
        const rate = 48000;
        const n = Math.round(rate * decayMs * 8 / 1000);
        const buffer = audioCtx.createBuffer(1, n, rate);
        const d = buffer.getChannelData(0);
        const f0 = Math.sqrt(low * high), q = f0 / (high - low), w = 2 * Math.PI * f0 / rate;
        const alpha = Math.sin(w) / (2 * q), a0 = 1 + alpha;
        let x1 = 0, x2 = 0, y1 = 0, y2 = 0, peak = 0;
        for (let i = 0; i < n; i++) {
          const x = Math.random() * 2 - 1;
          const y = (alpha / a0) * x - (alpha / a0) * x2 + (2 * Math.cos(w) / a0) * y1 - ((1 - alpha) / a0) * y2;
          x2 = x1; x1 = x; y2 = y1; y1 = y;
          d[i] = y;
          peak = Math.max(peak, Math.abs(y));
        }
        for (let i = 0; i < n; i++) {
          const t = i / rate * 1000;
          d[i] = d[i] / peak * amp * Math.min(1, t / 0.5) * Math.exp(-t / decayMs);
        }
        const node = audioCtx.createBufferSource();
        node.buffer = buffer;
        node.connect(mic);
        node.start();
      }
      window.playSnap = () => playBurst(1800, 6000, 7, 0.4);
      window.playClap = () => playBurst(500, 1800, 25, 0.6);

      const realGetUserMedia = MediaDevices.prototype.getUserMedia;
      MediaDevices.prototype.getUserMedia = async function (constraints) {
        if (document.getElementById('real').checked) return realGetUserMedia.call(this, constraints);
        const stream = (fake.nextCrop ? src2 : src).captureStream(30);
        Object.defineProperty(stream.getVideoTracks()[0], 'label', { value: 'Fake FaceTime HD Camera' });
        if (constraints?.audio) {
          ensureMic();
          await audioCtx.resume();
          stream.addTrack(mic.stream.getAudioTracks()[0].clone());
        }
        return stream;
      };
    </script>
    <script>
      // One-off: cut the person out of the test portrait so the fake camera can put them in
      // front of the known synthetic room. Uses the extension's own segmenter page.
      (async () => {
        const img = new Image();
        img.src = 'assets/portrait.jpg';
        // Not img.decode(): it never settles in a hidden background tab.
        if (!img.complete) await new Promise((r, e) => ((img.onload = r), (img.onerror = e)));
        const w = Math.round(img.naturalWidth / 2);
        const h = Math.round(img.naturalHeight / 2);

        const frame = document.createElement('iframe');
        frame.src = '../extension/segmenter/segmenter.html';
        frame.style.cssText = 'position:fixed;width:2px;height:2px;opacity:0;';
        document.body.append(frame);
        await new Promise((r) => frame.addEventListener('load', r, { once: true }));
        const channel = new MessageChannel();
        frame.contentWindow.postMessage({ type: 'snapdust:connect' }, location.origin, [channel.port2]);
        const next = () => new Promise((r) => (channel.port1.onmessage = (e) => r(e.data)));

        const ready = await next();
        if (ready.type !== 'ready') throw new Error(`cutout segmenter: ${ready.message}`);
        const bitmap = await createImageBitmap(img, { resizeWidth: w, resizeHeight: h });
        channel.port1.postMessage({ type: 'segment', id: 1, bitmap }, [bitmap]);
        const mask = await next();

        // Threshold the mask, then upscale it with a little smoothing for clean edges.
        const m = document.createElement('canvas');
        m.width = mask.width;
        m.height = mask.height;
        const alpha = new Uint8ClampedArray(mask.buffer);
        for (let i = 3; i < alpha.length; i += 4) alpha[i] = alpha[i] > 128 ? 255 : 0;
        m.getContext('2d').putImageData(new ImageData(alpha, mask.width, mask.height), 0, 0);

        const c = document.createElement('canvas');
        c.width = img.naturalWidth;
        c.height = img.naturalHeight;
        const ctx = c.getContext('2d');
        ctx.drawImage(m, 0, 0, c.width, c.height);
        ctx.globalCompositeOperation = 'source-in';
        ctx.drawImage(img, 0, 0);
        cutout = c;
        window.cutoutReady = true;
        frame.remove();
      })().catch((err) => console.error('cutout failed', err));
    </script>
    <script src="../extension/content/dust.js"></script>
    <script src="../extension/content/snap.js"></script>
    <script src="../extension/content/inject.js"></script>
    <script>
      const out = document.getElementById('out');
      const info = document.getElementById('info');
      let lastStatus = null;
      window.addEventListener('snapdust:status', (e) => (lastStatus = JSON.parse(e.detail)));

      function sendConfig() {
        const cfg = {
          enabled: document.getElementById('enabled').checked,
          showMask: document.getElementById('showMask').checked,
          mirror: document.getElementById('mirror').checked,
          effect: 'none',
          badge: false,
          snapEnabled: true,
          snapMode: window.snapModeForTest ?? 'sound',
          snapSensitivity: 0.5,
          segmenterUrl: new URL('../extension/segmenter/segmenter.html', location.href).href,
        };
        window.dispatchEvent(new CustomEvent('snapdust:config', { detail: JSON.stringify(cfg) }));
      }
      for (const id of ['enabled', 'showMask', 'mirror']) {
        document.getElementById(id).addEventListener('change', sendConfig);
      }
      sendConfig();

      window.sendCommand = (command) =>
        window.dispatchEvent(new CustomEvent('snapdust:command', { detail: JSON.stringify({ command }) }));
      document.getElementById('vanish').addEventListener('click', () => sendCommand('toggle-vanish'));
      document.getElementById('capture').addEventListener('click', () => sendCommand('capture-background'));

      window.getStatus = () => {
        window.dispatchEvent(new CustomEvent('snapdust:get-status'));
        return lastStatus;
      };

      // Reads one pixel of the output video, in output-video coordinates.
      window.samplePixel = (x, y) => {
        const c = document.createElement('canvas');
        c.width = out.videoWidth;
        c.height = out.videoHeight;
        const ctx = c.getContext('2d');
        ctx.drawImage(out, 0, 0);
        return Array.from(ctx.getImageData(x, y, 1, 1).data.slice(0, 3));
      };

      // While vanished, the output should be exactly the empty room. Compares the two over
      // `ms` and returns the share of pixels that visibly differ (the leftover "ghost").
      window.measureGhost = async (ms = 3000) => {
        const room = document.createElement('canvas');
        room.width = 640;
        room.height = 360;
        const rctx = room.getContext('2d', { willReadFrequently: true });
        // Redrawn per sample: a swaying bystander is part of what's expected. The output lags
        // the camera by about a frame, so it is compared against the scene ~40 ms earlier.
        const expectedNow = () => {
          rctx.filter = fake.brightness === 1 ? 'none' : `brightness(${fake.brightness})`;
          drawExpected(rctx, performance.now() - 40);
          return rctx.getImageData(0, 0, 640, 360).data;
        };
        const c = document.createElement('canvas');
        c.width = 640;
        c.height = 360;
        const ctx = c.getContext('2d', { willReadFrequently: true });
        let samples = 0, ghost = 0, worst = 0, diffSum = 0;
        const end = performance.now() + ms;
        while (performance.now() < end) {
          ctx.drawImage(out, 0, 0, 640, 360);
          const got = ctx.getImageData(0, 0, 640, 360).data;
          const expected = expectedNow();
          let frameGhost = 0;
          for (let i = 0; i < got.length; i += 4) {
            const d = (Math.abs(got[i] - expected[i]) + Math.abs(got[i + 1] - expected[i + 1]) + Math.abs(got[i + 2] - expected[i + 2])) / 3;
            diffSum += d;
            if (d > 25) frameGhost++;
          }
          ghost += frameGhost;
          worst = Math.max(worst, frameGhost);
          samples++;
          await new Promise((r) => setTimeout(r, 50));
        }
        const px = 640 * 360;
        return {
          ghostPct: +((100 * ghost) / (samples * px)).toFixed(2),
          worstFramePct: +((100 * worst) / px).toFixed(2),
          meanDiff: +(diffSum / (samples * px)).toFixed(2),
          samples,
        };
      };

      window.openSecondStream = async () => {
        fake.nextCrop = true;
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        fake.nextCrop = false;
        const v = document.createElement('video');
        v.muted = true;
        v.autoplay = true;
        v.width = 160;
        v.srcObject = stream;
        document.body.append(v);
        window.stream2 = stream;
      };

      document.getElementById('start').addEventListener('click', async () => {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        out.srcObject = new MediaStream(stream.getVideoTracks());
        window.testStream = stream;
        setInterval(() => {
          info.textContent = JSON.stringify(
            { label: stream.getVideoTracks()[0].label, status: getStatus() },
            null,
            2,
          );
        }, 500);
      });
    </script>
    <script>
      // Scripted checks. Run one with runScenario('name') and read window.result when done.
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      async function startCamera() {
        for (let i = 0; i < 120 && !window.cutoutReady; i++) await wait(250);
        document.getElementById('start').click();
        for (let i = 0; i < 40; i++) {
          await wait(250);
          if (getStatus()?.maskFps > 0) break;
        }
        await wait(1000);
      }
      async function capture() {
        sendCommand('capture-background');
        await wait(3500);
        for (let i = 0; i < 60 && getStatus().background === 'capturing'; i++) await wait(250);
        return { background: getStatus().background, known: +getStatus().backgroundKnown.toFixed(2) };
      }
      async function phaseTimeline(ms) {
        const seen = [];
        const end = performance.now() + ms;
        while (performance.now() < end) {
          const p = getStatus().phase;
          if (seen.at(-1) !== p) seen.push(p);
          await wait(100);
        }
        return seen;
      }
      const scenarios = {
        // Capture while never leaving the frame (what happened on the real call).
        async stay() {
          await startCamera();
          const r = { capture: await capture() };
          sendCommand('vanish');
          r.phases = await phaseTimeline(6500);
          r.face = samplePixel(320, 110);
          r.chest = samplePixel(320, 300);
          r.ghost = await measureGhost(2000);
          return r;
        },
        // Leftover traces of you while gone, sitting still and moving fast.
        async motion() {
          await startCamera();
          fake.away = true;
          const r = { capture: await capture() };
          fake.away = false;
          await wait(1500);
          sendCommand('vanish');
          await wait(6200);
          r.phase = getStatus().phase;
          fake.speed = 1;
          r.slow = await measureGhost(3000);
          fake.speed = 3;
          r.fast = await measureGhost(3000);
          fake.speed = 1;
          return r;
        },
        // Snapping (sound only): snap -> dust, clap -> nothing, snap -> back.
        // Needs the camera started with a real click first (audio needs a user gesture).
        async snapSound() {
          setSnapMode('sound');
          for (let i = 0; i < 40; i++) {
            await wait(250);
            if (getStatus()?.maskFps > 0) break;
          }
          fake.away = true;
          const r = { capture: await capture() };
          fake.away = false;
          await wait(1500);
          r.micListening = getStatus().snap.mic;
          playSnap();
          await wait(400);
          r.afterSnap = getStatus().phase;
          r.heard = getStatus().snap.lastSound;
          await wait(6000);
          playClap();
          await wait(400);
          r.afterClap = { phase: getStatus().phase, heard: getStatus().snap.lastSound };
          playSnap();
          await wait(400);
          r.afterSecondSnap = getStatus().phase;
          await wait(4500);
          r.end = getStatus().phase;
          setSnapMode('both');
          await wait(300);
          playSnap();
          await wait(500);
          r.bothModeSoundAlone = { phase: getStatus().phase, snaps: getStatus().snap.count };
          return r;
        },
        // Camera off/on many times (as when toggling video in Meet), vanishing each time, so
        // every stream builds its own dust renderer. Then one last vanish must still work.
        async toggle({ rounds = 20 } = {}) {
          const video = document.createElement('video');
          video.muted = true;
          document.body.append(video);
          const r = { rounds: [] };
          for (let i = 0; i < rounds; i++) {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            video.srcObject = stream;
            await wait(900);
            sendCommand('vanish');
            await wait(500);
            const phase = getStatus().phase;
            sendCommand('appear');
            await wait(500);
            stream.getTracks().forEach((t) => t.stop());
            r.rounds.push(phase);
          }
          const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          out.srcObject = stream;
          await wait(900);
          sendCommand('vanish');
          await wait(1200);
          r.finalPhase = getStatus().phase;
          r.finalError = getStatus().lastError;
          r.streamsOpen = getStatus().streams.length;
          sendCommand('appear');
          return r;
        },
        // Vanish, then turn the camera off and on again (Meet opens a new stream): you must
        // stay gone, with the captured room, from the new stream's first frames.
        async offOn() {
          await startCamera();
          fake.away = true;
          const r = { capture: await capture() };
          fake.away = false;
          await wait(1500);
          sendCommand('vanish');
          await wait(6200);
          r.before = { phase: getStatus().phase, ghost: (await measureGhost(500)).ghostPct };
          window.testStream.getTracks().forEach((t) => t.stop());
          await wait(500);
          const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          out.srcObject = stream;
          window.testStream = stream;
          await wait(150);
          r.firstMoments = await measureGhost(600);
          r.afterReopen = { phase: getStatus().phase, background: getStatus().background, streams: getStatus().streams };
          await wait(1500);
          r.later = await measureGhost(1500);
          sendCommand('appear');
          await wait(4500);
          r.cameBack = getStatus().phase;
          return r;
        },
        // Someone else in frame: only the main (largest) person should vanish.
        async twoPeople() {
          fake.second = true;
          fake.speed = 0; // main person stands still, so the gap between them stays clear
          await startCamera();
          fake.away = true;
          const r = { capture: await capture() };
          fake.away = false;
          await wait(1500);
          sendCommand('vanish');
          await wait(6200);
          r.phase = getStatus().phase;
          r.ghost = await measureGhost(2000);
          r.secondPersonFace = samplePixel(72, 215);
          r.wallThere = [201, 194, 180];
          const setWho = (who) =>
            window.dispatchEvent(new CustomEvent('snapdust:config', { detail: JSON.stringify({ vanishWho: who }) }));
          setWho('everyone');
          await wait(1500);
          r.everyoneMode = await measureGhost(1500);
          setWho('me');
          await wait(1500);
          r.backToJustMe = await measureGhost(1500);
          return r;
        },
        // Proper capture, then a full vanish and return.
        async full() {
          await startCamera();
          fake.away = true;
          const r = { capture: await capture() };
          fake.away = false;
          await wait(1500);
          sendCommand('vanish');
          r.vanishPhases = await phaseTimeline(6500);
          r.goneGhost = await measureGhost(2000);
          r.renderMsDuringDust = null;
          sendCommand('appear');
          r.returnPhases = await phaseTimeline(4000);
          fake.speed = 0;
          await wait(500);
          r.backFace = samplePixel(320, 110);
          return r;
        },
      };
      window.setSnapMode = (mode) => {
        window.snapModeForTest = mode;
        sendConfig();
      };

      window.runScenario = (name) => {
        window.result = null;
        scenarios[name]().then(
          (r) => (window.result = { ...r, renderMs: +getStatus().renderMs.toFixed(1), error: getStatus().lastError }),
          (e) => (window.result = { failed: String(e) }),
        );
        return 'started';
      };
    </script>
  </body>
</html>
