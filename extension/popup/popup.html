<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SnapDust</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>SnapDust <span>phase 4</span></h1>

    <div class="buttons">
      <button id="vanish" class="primary">Vanish</button>
      <button id="capture">Capture empty room</button>
    </div>
    <p class="hint">Shortcuts: <kbd>⌥⇧V</kbd> vanish/reappear, <kbd>⌥⇧B</kbd> capture room.</p>

    <section id="status">Checking…</section>

    <section class="snap">
      <label class="row">
        <input type="checkbox" id="snapEnabled" />
        <strong>Snap to vanish / come back</strong>
      </label>
      <label class="row">
        Detect by
        <select id="snapMode">
          <option value="both">Sound + hand (fewest mistakes)</option>
          <option value="sound">Sound only</option>
          <option value="hand">Hand only (no mic)</option>
        </select>
      </label>
      <label class="row">
        Sensitivity
        <input type="range" id="snapSensitivity" min="0" max="1" step="0.05" />
      </label>
      <div id="snapStatus" class="hint"></div>
    </section>

    <details>
      <summary>Settings</summary>

      <label class="row">
        <input type="checkbox" id="enabled" />
        Process my camera
      </label>

      <label class="row">
        Who vanishes
        <select id="vanishWho">
          <option value="me">Just me</option>
          <option value="everyone">Everyone in frame</option>
        </select>
      </label>

      <label class="row">
        <input type="checkbox" id="mirror" />
        Flip my video for others
      </label>

      <label class="row">
        <input type="checkbox" id="showMask" />
        Show detection outline (debug)
      </label>

      <label class="row">
        <input type="checkbox" id="badge" />
        Show "SnapDust" badge on video
      </label>

      <label class="row">
        Colour filter
        <select id="effect">
          <option value="none">None</option>
          <option value="grayscale">Grayscale</option>
          <option value="sepia">Sepia</option>
          <option value="invert">Invert</option>
          <option value="hue">Hue shift</option>
        </select>
      </label>
    </details>

    <script type="module" src="popup.js"></script>
  </body>
</html>
