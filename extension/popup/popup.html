<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SnapDust</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="../icons/icon-32.png" alt="" width="20" height="20" />
      <h1>SnapDust</h1>
    </header>

    <p id="status">Checking…</p>

    <div class="buttons">
      <button id="vanish" class="primary">Vanish</button>
      <button id="capture">Capture empty room</button>
    </div>

    <section class="snap">
      <label class="row">
        <input type="checkbox" id="snapEnabled" />
        Snap to vanish and come back
      </label>
      <label class="row">
        Detect by
        <select id="snapMode">
          <option value="both">Sound + hand</option>
          <option value="sound">Sound only</option>
          <option value="hand">Hand only (no mic)</option>
        </select>
      </label>
      <label class="row">
        Sensitivity
        <input type="range" id="snapSensitivity" min="0" max="1" step="0.05" />
      </label>
      <p id="snapStatus" class="hint"></p>
    </section>

    <details>
      <summary>More</summary>
      <label class="row">
        Who vanishes
        <select id="vanishWho">
          <option value="me">Just me</option>
          <option value="everyone">Everyone in frame</option>
        </select>
      </label>
      <label class="row">
        <input type="checkbox" id="enabled" />
        SnapDust on
      </label>
      <p class="hint">Shortcuts: <kbd>⌥⇧V</kbd> vanish / come back, <kbd>⌥⇧B</kbd> capture room.</p>
    </details>

    <script type="module" src="popup.js"></script>
  </body>
</html>
